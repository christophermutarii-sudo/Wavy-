<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wavy - Reels</title><link rel="stylesheet" href="style.css"><script src="settings.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/auth.js"></script></head>
<body>
<div class="top"><div class="logo">Wavy<span>🌊</span></div><div style="display:flex;gap:8px"><a href="wavy.html">🤖</a><a href="settings.html">⚙️</a></div></div>
<div class="container" style="padding-top:10px"><div class="page-title"><span>Reels</span><span class="icons"><span>📷</span></span></div><div class="search-pill">🔍 <input placeholder="Search reels..."></div><div class="tabs"><button class="active">For You</button><button>Following</button><button>Music</button></div><div id="reelsBox"></div>
<div class="card center"><b>🎬 Post a Reel</b><p class="muted">Share a short video moment!</p><button class="btn" onclick="alert('Reel upload coming soon! Use Home Post for now.')">+ Create Reel</button></div></div>
<div class="bottom-nav"><a href="index.html"><span>🏠</span></a><a href="reels.html" class="active"><span>🎬</span></a><a href="wavy.html"><span>🤖</span></a><a href="chat.html"><span>💬</span></a><a href="profile.html"><span>👤</span></a></div>
<script>db.collection("posts").orderBy("createdAt","desc").limit(20).onSnapshot(function(snap){var b=document.getElementById('reelsBox');var h='';snap.forEach(function(d){var p=d.data();h+='<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">'+(p.name||'W')[0].toUpperCase()+'</div><b onclick="location.href=\'profile.html?email='+p.email+'\'" style="cursor:pointer">'+p.name+'</b></div><p style="margin-top:10px;line-height:1.5">'+p.text+'</p><div style="display:flex;gap:16px;color:#888;font-size:13px"><span>❤️ Like</span><span>💬 Comment</span><span>↗ Share</span></div></div>'});b.innerHTML=h||'<p class="muted" style="text-align:center">No reels yet. Post on Home!</p>'})</script></body></html>
