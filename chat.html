<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavy - Chats</title>
<link rel="stylesheet" href="style.css">
<script src="settings.js"></script>
<script src="auth.js"></script>
<style>
/* ===== WAVY CSS - ROW FORM + HEXAGON RING - NOT META ===== */
body{background:#fff !important}
.top{position:sticky;top:0;background:#fff;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.logo{font-size:22px;font-weight:800}
.chat-list{margin:0;padding:0;background:#fff}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #eee;background:#fff;cursor:pointer;width:100%;box-sizing:border-box}
.chat-row:active{background:#f5f5f5}
.chat-meta{flex:1;min-width:0;text-align:left;overflow:hidden}
.chat-meta .name-row{display:flex;align-items:center;gap:6px}
.chat-meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta .preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.chat-time{font-size:11px;color:#888;text-align:right;flex-shrink:0}
.ai-badge{background:#0082ff;color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;flex-shrink:0}
.unread-badge{background:#0082ff;color:#fff;font-size:11px;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:4px}
.search-row{background:#f0f0f0;border-radius:999px;padding:10px 14px;display:flex;gap:8px;margin:10px 16px}
.search-row input{background:transparent;border:none;outline:none;width:100%;font-size:15px}
.tabs-row{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.tabs-row button{border:none;padding:8px 18px;border-radius:999px;white-space:nowrap;font-size:14px}
.tabs-row button.active{background:#0082ff;color:#fff}
.tabs-row button.inactive{background:#f0f0f0;color:#000}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
.bottom-nav a{font-size:22px;text-decoration:none}
.bottom-nav a.active{opacity:1}
.muted{color:#888}

/* ===== WAVY HEXAGON RING - AGREED - NOT META CIRCLE ===== */
.wavy-hex-ring{width:56px;height:56px;flex-shrink:0;background:conic-gradient(from 0deg,#0082ff,#00e5ff,#0082ff,#a855f7,#0082ff);clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;padding:3px;box-sizing:border-box}
.wavy-hex-inner{width:100%;height:100%;background:#fff;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center}
.wavy-hex-img{width:44px;height:44px;background:linear-gradient(135deg,#0082ff,#00e5ff);clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800}
.wavy-hex-ring.seen{background:#ddd}
.wavy-hex-ring.mine{background:conic-gradient(from 0deg,#00c853,#00e5ff,#00c853)}
.wavy-hex-ring.ai{background:conic-gradient(from 0deg,#0082ff,#00e5ff,#a855f7,#0082ff)}
</style>
</head>
<body>
<div class="top"><div class="logo">Wavy<span>🌊</span></div><div style="display:flex;gap:12px"><a href="settings.html" style="text-decoration:none;font-size:20px">⚙️</a><a href="chat.html" style="text-decoration:none;font-size:20px">✏️</a></div></div>

<div style="padding:10px 16px 0"><h2 style="margin:0">Chats</h2></div>

<div class="search-row"><span>🔍</span><input id="searchInput" placeholder="Search" oninput="filterChats(this.value)"></div>

<!-- YOUR NOTE - ROW + HEXAGON -->
<div class="chat-row" onclick="location.href='chat.html?email=self'">
  <div class="wavy-hex-ring mine"><div class="wavy-hex-inner"><div class="wavy-hex-img">W</div></div></div>
  <div class="chat-meta"><b>Your note</b><span class="preview">Tap to write a note to yourself</span></div>
  <div class="chat-time">›</div>
</div>

<div class="tabs-row">
  <button class="active">Inbox</button>
  <button class="inactive">Unread</button>
  <button class="inactive">Marketplace</button>
  <button class="inactive">Communities</button>
</div>

<!-- CHATS - ROW FORM -->
<div class="chat-list" id="chatList">
  <!-- 1. WAVY AI - FIRST ROW + HEXAGON RING -->
  <div class="chat-row" onclick="location.href='wavy.html'">
    <div style="position:relative;flex-shrink:0">
      <div class="wavy-hex-ring ai"><div class="wavy-hex-inner"><div class="wavy-hex-img">🤖</div></div></div>
      <span style="position:absolute;bottom:2px;right:2px;background:#00c853;width:12px;height:12px;border-radius:50%;border:2px solid #fff"></span>
    </div>
    <div class="chat-meta">
      <div class="name-row"><b>Wavy AI 🌊</b><span class="ai-badge">AI</span></div>
      <span class="preview" id="aiPreview">Hi! I am Wavy AI 🌊 Tap + to upload photo, doc...</span>
    </div>
    <div class="chat-time">Now<br><span class="unread-badge">NEW</span></div>
  </div>

  <!-- 2. OTHERS - ROWS + HEXAGON -->
  <div id="otherChats"><p class="muted" style="text-align:center;padding:20px">Loading chats... ⏳</p></div>
</div>

<!-- SEND MESSAGE - ROW -->
<div style="border-top:1px solid #eee;padding:12px 16px;background:#fff;margin-bottom:60px">
  <b>Send Message</b>
  <div style="display:flex;gap:8px;margin-top:8px">
    <input id="quickMsg" placeholder="Type a message..." style="flex:1;background:#f0f0f0;border:none;border-radius:999px;padding:12px 16px;outline:none">
    <button style="background:#0082ff;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:700" onclick="quickSend()">Send</button>
  </div>
  <p class="muted" style="font-size:12px">Quick send goes to Wavy AI if no chat selected.</p>
</div>

<div class="bottom-nav">
  <a href="index.html"><span>🏠</span></a>
  <a href="reels.html"><span>🎬</span></a>
  <a href="wavy.html"><span>🤖</span></a>
  <a href="chat.html" class="active"><span>💬</span></a>
  <a href="profile.html"><span>👤</span></a>
</div>

<script>
function getOfflineUsers(){ try{ return JSON.parse(localStorage.getItem('wavy_offline_users')||'[]'); }catch(e){ return []; } }
function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('wavy_current_user')||'null'); }catch(e){ return null; } }
function safeDb(){ try{ return typeof db!=='undefined' ? db : null; }catch(e){ return null; } }
function quickSend(){
  var t=document.getElementById('quickMsg').value.trim();
  if(!t) return;
  localStorage.setItem('wavy_ai_auto_prompt', t);
  localStorage.setItem('wavy_ai_auto_mode', 'chat');
  location.href='wavy.html';
}
var allChats=[];
function renderChats(filter){
  var box=document.getElementById('otherChats');
  var me=getCurrentUser();
  var list=allChats.filter(function(u){
    if(me && u.email===me.email) return false;
    if(filter && u.name.toLowerCase().indexOf(filter.toLowerCase())===-1 && u.email.toLowerCase().indexOf(filter.toLowerCase())===-1) return false;
    return true;
  });
  if(!list.length){
    box.innerHTML='<div style="padding:20px;text-align:center"><b>No other chats yet</b><p class="muted">Register another account to chat!<br>Wavy AI is always here on top! 🤖</p><button style="background:#0082ff;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:700" onclick="location.href=\'wavy.html\'">💬 Chat with Wavy AI</button></div>';
    return;
  }
  var h='';
  list.forEach(function(u){
    var last='Tap to start chatting';
    try{ var msgs=JSON.parse(localStorage.getItem('wavy_chat_'+u.email)||'[]'); if(msgs.length) last=msgs[msgs.length-1].text||msgs[msgs.length-1].msg||'📎 File'; }catch(e){}
    h+='<div class="chat-row" onclick="location.href=\'chat.html?email='+u.email+'\'"><div class="wavy-hex-ring"><div class="wavy-hex-inner"><div class="wavy-hex-img">'+(u.name||'W')[0].toUpperCase()+'</div></div></div><div class="chat-meta"><b>'+u.name+'</b><span class="preview">'+last+'</span></div><div class="chat-time">Now<br>›</div></div>';
  });
  box.innerHTML=h;
}
function filterChats(v){ renderChats(v); }
async function loadChats(){
  try{ var h=JSON.parse(localStorage.getItem('wavy_ai_last')||'null'); if(h) document.getElementById('aiPreview').textContent=h.substring(0,60); }catch(e){}
  allChats=getOfflineUsers(); renderChats('');
  var myDb=safeDb();
  if(navigator.onLine && myDb){
    try{ var snap=await myDb.collection("users").get(); snap.forEach(function(d){ var uu=d.data(); if(uu.email && !allChats.find(function(x){ return x.email===uu.email; })) allChats.push(uu); }); renderChats(document.getElementById('searchInput').value); }catch(e){}
  }
}
loadChats();
</script>
</body>
</html>
