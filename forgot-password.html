<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavy - Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/settings.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/auth.js"></script>
</head>
<body style="padding-bottom:0">
<div class="login-wrap">
  <div class="wavy-logo-big">W</div>
  <h2 style="text-align:center">Find Your Account</h2>
  <p style="text-align:center;color:#888;font-size:14px;margin:8px 0 16px">Enter email to get reset link</p>
  <div class="form-card">
    <input id="resetEmail" placeholder="Email">
    <button class="btn" onclick="sendReset()">Send Reset Link 📧</button>
    <p id="err" style="color:#ff4444;text-align:center;margin-top:10px;display:none"></p>
  </div>
  <div id="successBox" class="success-box" style="display:none"><b style="color:#00a152">Link Sent! ✅</b><p style="color:#555;margin:8px 0">Check your email + spam folder</p><button class="btn" onclick="location.href='login.html'">Back to Login</button></div>
  <p style="text-align:center;color:#0082ff;margin-top:14px;cursor:pointer" onclick="location.href='forgot-password-code.html'">Or use 6-digit Code instead →</p>
  <button class="btn btn-outline" style="margin-top:14px" onclick="location.href='login.html'">← Back to Login</button>
</div>
<script>
function sendReset(){ var email=document.getElementById('resetEmail').value.trim(); if(!email||email.indexOf('@')===-1){ document.getElementById('err').style.display='block'; document.getElementById('err').textContent='Enter valid email!'; return; } auth.sendPasswordResetEmail(email).then(function(){ document.getElementById('successBox').style.display='block'; }).catch(function(e){ document.getElementById('err').style.display='block'; document.getElementById('err').textContent=e.message; }); }
</script>
</body>
</html>
