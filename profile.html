<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavy - Profile</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="settings.js"></script>
<script src="auth.js"></script>
<style>
.top svg,.page-title svg,.bottom-nav svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav a{display:flex;align-items:center;justify-content:center}
.bottom-nav a.active svg{stroke:#0082ff}
.top a{display:flex;align-items:center;justify-content:center}
.icon-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Wavy <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:#000;stroke-width:1.8;vertical-align:middle"><path d="M2 12 C5 7 9 7 12 12 C15 17 19 17 22 12"/><path d="M2 17 C5 12 9 12 12 17 C15 22 19 22 22 17"/></svg></div>
  <div style="display:flex;gap:12px">
    <a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M19.1 4.9 L17 7 M7 17 L4.9 19.1"/></svg></a>
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10 L12 2 L21 10 V20 H3 Z"/><path d="M9 20 V14 H15 V20"/></svg></a>
  </div>
</div>

<div class="container" style="padding-top:10px">
  <div class="page-title"><span>Profile</span><span class="icons"><span onclick="location.href='settings.html'" style="cursor:pointer"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M19.1 4.9 L17 7 M7 17 L4.9 19.1"/></svg></span></span></div>

  <div id="profileBox">
    <div class="card center">
      <div class="avatar" id="myAvatar" style="width:80px;height:80px;font-size:32px;margin:0 auto">W</div><br>
      <h2 id="profileName">Loading...</h2>
      <p class="muted" id="profileEmail"></p>
      <p id="profileStats" class="muted">0 posts</p>
      <p id="modeLabel" class="muted" style="font-size:12px"></p><br>
      <div id="profileActions"></div>
    </div>

    <div class="tabs"><button class="active">Posts</button><button>Photos</button><button>About</button></div>

    <div class="card"><b id="postsTitle">Posts</b><div id="userPosts"></div></div>
    <div class="card"><b>All Accounts - Mine + Others</b><div id="otherUsers">Loading...</div></div>
  </div>
</div>

<div class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10 L12 2 L21 10 V20 H3 Z"/><path d="M9 20 V14 H15 V20"/></svg></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10 L21 7 V17 L16 14"/></svg></a>
  <a href="wavy.html"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/><path d="M8 9 H16 M8 12 H13"/></svg></a>
  <a href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/></svg></a>
  <a href="profile.html" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 8 14 12 14 C16 14 20 16 20 21"/></svg></a>
</div>

<script>
function safeDb(){ try{ return typeof db!=='undefined' ? db : null; }catch(e){ return null; } }
function safeAuth(){ try{ return typeof auth!=='undefined' ? auth : null; }catch(e){ return null; } }
function getOfflineUsers(){ try{ return JSON.parse(localStorage.getItem('wavy_offline_users')||'[]'); }catch(e){ return []; } }
function getOfflineCurrent(){ try{ return JSON.parse(localStorage.getItem('wavy_current_user')||'null'); }catch(e){ return null; } }
function getOfflinePosts(){ try{ return JSON.parse(localStorage.getItem('wavy_offline_posts')||'[]'); }catch(e){ return []; } }
function getParam(n){ return new URLSearchParams(window.location.search).get(n); }

async function loadProfile(){
  var myDb = safeDb();
  var myAuth = safeAuth();
  var tEmail = getParam('email');
  var tUid = getParam('uid');
  var offlineMe = getOfflineCurrent();
  var offlineUsers = getOfflineUsers();
  var u = null;
  if(tEmail){
    u = offlineUsers.find(function(x){ return x.email===tEmail; });
  } else if(offlineMe){
    u = offlineMe;
    var full = offlineUsers.find(function(x){ return x.email===offlineMe.email; });
    if(full) u = full;
  }
  if(navigator.onLine && myDb && myAuth){
    try{
      var cu = myAuth.currentUser;
      if(!cu){
        cu = await new Promise(function(res){
          var done=false;
          var un = myAuth.onAuthStateChanged(function(user){ if(!done){ done=true; if(un) un(); res(user); } });
          setTimeout(function(){ if(!done){ done=true; if(un) un(); res(null); } }, 1500);
        });
      }
      if(tUid && !u){
        var s = await myDb.collection("users").doc(tUid).get();
        if(s.exists) u = s.data();
      } else if(tEmail && !u){
        var q = await myDb.collection("users").where("email","==",tEmail).get();
        if(!q.empty) u = q.docs[0].data();
      } else if(cu && !u){
        var m = await myDb.collection("users").doc(cu.uid).get();
        if(m.exists) u = m.data();
        else u = {uid:cu.uid, name:cu.displayName||cu.email.split('@')[0], email:cu.email};
      }
      if(u) document.getElementById('modeLabel').textContent = 'Cloud Mode - Your old accounts are safe!';
    }catch(e){
      console.log('Firebase failed, using offline:', e);
      document.getElementById('modeLabel').textContent = 'Offline Mode - Showing phone accounts (Firebase accounts still safe in cloud!)';
    }
  } else {
    document.getElementById('modeLabel').textContent = 'Offline Mode - No data / Firebase file missing. Your Firebase accounts are still safe in cloud!';
  }
  if(!u){
    document.getElementById('profileName').textContent = 'No account logged in';
    document.getElementById('profileEmail').textContent = 'Login to see your profile';
    document.getElementById('profileActions').innerHTML = '<button class="btn" onclick="location.href=\'login.html\'">Go to Login</button><br><br><button class="btn btn-outline" onclick="location.href=\'login.html\'">Register New Account (Offline)</button>';
    document.getElementById('userPosts').innerHTML = '<p class="muted">Login first to see posts.</p>';
    showAllUsers(null);
    return;
  }
  var isMe = !tEmail || (offlineMe && offlineMe.email===u.email);
  document.getElementById('myAvatar').textContent = (u.name||"W")[0].toUpperCase();
  if(u.pic) document.getElementById('myAvatar').innerHTML = '<img src="'+u.pic+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
  document.getElementById('profileName').textContent = (isMe ? 'You - ' : '') + u.name;
  document.getElementById('profileEmail').textContent = u.email;
  document.getElementById('postsTitle').textContent = isMe ? "My Posts" : u.name + "'s Posts";
  var a = document.getElementById('profileActions');
  a.innerHTML = isMe
    ? '<button class="btn btn-outline" onclick="wavyLogout()">Logout</button><br><br><button class="btn" onclick="location.href=\'login.html\'">Switch Account</button><br><br><button class="btn" onclick="location.href=\'settings.html\'">Settings</button>'
    : '<button class="btn" onclick="location.href=\'chat.html?email='+u.email+'\'">Chat with '+u.name+'</button><br><br><button class="btn btn-outline" onclick="location.href=\'profile.html\'">Back to My Profile</button>';
  var posts = getOfflinePosts().filter(function(p){ return p.email===u.email; });
  var pe = document.getElementById('userPosts');
  if(!posts.length){ pe.innerHTML='<p class="muted">No posts yet.</p>'; document.getElementById('profileStats').textContent='0 posts'; }
  else{
    var h=''; posts.forEach(function(p){ h+='<div class="msg"><b>'+p.name+':</b> '+(p.text||'')+'</div>'; });
    pe.innerHTML=h; document.getElementById('profileStats').textContent=posts.length+' posts';
  }
  if(navigator.onLine && myDb){
    try{
      var ps = await myDb.collection("posts").where("email","==",u.email).get();
      if(!ps.empty){
        var h2=''; ps.forEach(function(d){ var p=d.data(); h2+='<div class="msg"><b>'+p.name+':</b> '+(p.text||'')+'</div>'; });
        if(h2){ pe.innerHTML = h2 + pe.innerHTML; document.getElementById('profileStats').textContent = (ps.size + posts.length)+' posts'; }
      }
    }catch(e){}
  }
  showAllUsers(u);
}
async function showAllUsers(currentU){
  var offlineUsers = getOfflineUsers();
  var myDb = safeDb();
  var all = offlineUsers.slice();
  if(navigator.onLine && myDb){
    try{
      var snap = await myDb.collection("users").get();
      snap.forEach(function(d){
        var uu=d.data();
        if(uu.email && !all.find(function(x){ return x.email===uu.email; })) all.push(uu);
      });
    }catch(e){}
  }
  var oh='';
  if(!all.length){
    oh='<p class="muted">No accounts yet. Register one - Offline works with no data!</p>';
  } else {
    all.forEach(function(uu){
      var isMe2 = currentU && uu.email===currentU.email;
      oh+='<div class="msg" style="display:flex;justify-content:space-between;align-items:center;background:'+(isMe2 ? '#e0f0ff' : '#f0f0f0')+'"><span><b>'+(isMe2 ? 'You - ' : '')+uu.name+'</b><br><span class="muted">'+uu.email+'</span></span><button class="btn" style="width:auto;padding:8px 16px" onclick="location.href=\'profile.html?email='+uu.email+'\'">View</button></div>';
    });
  }
  document.getElementById('otherUsers').innerHTML=oh;
}
loadProfile();
</script>
</body>
</html>
