<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavy</title>
<link rel="stylesheet" href="style.css">
<script src="settings.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<style>
.top-icon{cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-icon svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav svg{width:24px;height:24px;fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav a.active svg{stroke:#0082ff}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#000}
.bottom-nav a small{font-size:11px}
.floating-ai svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai-banner svg{width:20px;height:20px;fill:none;stroke:#000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.post-action{display:flex;align-items:center;gap:6px;cursor:pointer}
.post-action svg{width:18px;height:18px;fill:none;stroke:#888;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="container" style="padding-top:10px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px">
    <h1 style="font-size:32px;font-weight:900">Wavy</h1>
    <div style="display:flex;gap:16px">
      <span class="top-icon" onclick="location.href='chat.html'"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21 L16.5 16.5"/></svg></span>
      <span class="top-icon"><svg viewBox="0 0 24 24"><path d="M12 3 C12 3 6 6 6 11 C6 15 5 17 4 18 H20 C19 17 18 15 18 11 C18 6 12 3 12 3 Z"/><path d="M10 20 C10 21 11 22 12 22 C13 22 14 21 14 20"/></svg></span>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px">
    <b style="font-size:18px">Stories</b>
    <span style="color:#0082ff;font-size:14px;cursor:pointer">See all</span>
  </div>

  <div class="story-row" id="storyRow"></div>

  <div class="tabs"><button class="active">For You</button><button>Following</button><button>Trending</button></div>

  <div class="ai-banner" onclick="location.href='wavy.html'">
    <h3 style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/><path d="M8 9 H16 M8 12 H13"/></svg> Wavy AI is LIVE!</h3>
    <p style="margin:6px 0 10px">Chat, poems, homework + generate images!</p>
    <button style="display:flex;align-items:center;gap:6px">Try Wavy AI <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg></button>
  </div>

  <div class="card">
    <div style="display:flex;gap:12px;align-items:center"><div class="avatar" id="myAvatar">W</div><input id="postText" placeholder="What's wavy today?"></div>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="createPost()">Post</button><button class="btn btn-outline" style="width:auto;padding:12px 18px;display:flex;align-items:center;gap:6px" onclick="location.href='wavy.html'"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#000;stroke-width:1.8"><path d="M12 3 L15 8.5 L22 9.5 L17 14.5 L18.5 21.5 L12 18 L5.5 21.5 L7 14.5 L2 9.5 L9 8.5 Z"/></svg> AI Image</button></div>
  </div>

  <div class="card" id="otherAccounts">Loading...</div>
  <div style="font-size:20px;font-weight:800;margin:10px 0">For you</div>
  <div id="feed"><div class="card center">Loading posts...</div></div>
</div>

<div class="floating-ai" onclick="location.href='wavy.html'"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/><path d="M8 9 H16 M8 12 H13"/></svg></div>

<div class="bottom-nav">
  <a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 10 L12 2 L21 10 V20 H3 Z"/><path d="M9 20 V14 H15 V20"/></svg><small>home</small></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10 L21 7 V17 L16 14"/></svg><small>reels</small></a>
  <a href="wavy.html"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/><path d="M8 9 H16 M8 12 H13"/></svg><small>AI</small></a>
  <a href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/></svg><small>Chats</small></a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 8 14 12 14 C16 14 20 16 20 21"/></svg><small>profile</small></a>
</div>

<script>
function safeAuth(){
  try{ return typeof auth !== 'undefined' ? auth : null; }catch(e){ return null; }
}
function safeDb(){
  try{ return typeof db !== 'undefined' ? db : null; }catch(e){ return null; }
}
async function loadOtherAccounts(){
  var el=document.getElementById('otherAccounts');
  var sr=document.getElementById('storyRow');
  var myDb=safeDb();
  if(!myDb){
    sr.innerHTML='';
    el.innerHTML='<b style="color:#ff4444">Firebase not connected!</b><p class="muted">Fix js/settings.js with your REAL apiKey to see real accounts.</p>';
    return;
  }
  try{
    var snap=await myDb.collection("users").get();
    if(snap.empty){
      sr.innerHTML='';
      el.innerHTML='<b>No accounts yet</b><p class="muted">Create a real account in Register - it will appear here!</p>';
      return;
    }
    var h='<b>Real People ('+snap.size+')</b><br><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
    var sh='';
    var themes=['theme-ocean','theme-sunset','theme-candy','theme-fire'];
    var ti=0;
    snap.forEach(function(d){
      var u=d.data();
      if(!u.name || !u.email) return;
      var theme=themes[ti%themes.length]; ti++;
      h+='<button onclick="location.href=\'profile.html?uid='+u.uid+'\'" style="background:#f0f0f0;border:none;padding:8px 12px;border-radius:999px;cursor:pointer">'+u.name+'</button>';
      sh+='<button class="wavy-story unseen '+theme+'" onclick="location.href=\'profile.html?uid='+u.uid+'\'"><span class="wavy-hex-ring"><span class="wavy-hex-inner"><span class="wavy-hex-img">'+(u.name||'W')[0].toUpperCase()+'</span></span></span><span>'+u.name.split(' ')[0]+'</span></button>';
    });
    h+='</div>'; el.innerHTML=h;
    sr.innerHTML='<button class="wavy-story mine theme-ocean" onclick="location.href=\'profile.html\'"><span style="position:relative;display:block"><span class="wavy-hex-ring"><span class="wavy-hex-inner"><span class="wavy-hex-img">W</span></span></span><span class="wavy-hex-plus">+</span></span><span>Your note</span></button>'+sh;
  }catch(e){ el.innerHTML='Error: '+e.message; sr.innerHTML=''; }
}
async function createPost(){
  var t=document.getElementById('postText').value.trim();
  if(!t) return alert('Write something!');
  var myAuth=safeAuth(); var myDb=safeDb();
  if(!myDb) return alert('Firebase not connected! Fix js/settings.js first!');
  var u=myAuth ? myAuth.currentUser : null;
  if(!u) return alert('Please login first to post!');
  var n=u.displayName||localStorage.getItem('wavyName')||u.email.split('@')[0];
  await myDb.collection("posts").add({text:t,name:n,email:u.email,uid:u.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  document.getElementById('postText').value='';
}
function loadFeed(){
  var f=document.getElementById('feed');
  var myDb=safeDb();
  if(!myDb){ f.innerHTML='<div class="card center"><b>Firebase not connected</b><p class="muted">Fix js/settings.js to see real posts</p></div>'; return; }
  myDb.collection("posts").orderBy("createdAt","desc").onSnapshot(function(snap){
    f.innerHTML='';
    if(snap.empty){ f.innerHTML='<div class="card center"><b>No real posts yet</b><p class="muted">Be first to post!</p></div>'; return; }
    snap.forEach(function(d){
      var p=d.data();
      if(!p.name) return;
      var div=document.createElement('div');
      div.className='post';
      div.innerHTML='<div class="avatar">'+(p.name||'W')[0].toUpperCase()+'</div><div style="flex:1;text-align:left"><b class="post-name" onclick="location.href=\'profile.html?email='+p.email+'\'">'+p.name+'</b> <span class="muted">• Wavy</span><div style="margin:8px 0;line-height:1.5">'+p.text+'</div><div style="display:flex;gap:16px;color:#888;font-size:13px"><span class="post-action"><svg viewBox="0 0 24 24"><path d="M12 21 C7 16 3 12.5 3 8.5 C3 5.5 5.5 3 8 3 C10 3 11.5 4 12 5.5 C12.5 4 14 3 16 3 C18.5 3 21 5.5 21 8.5 C21 12.5 17 16 12 21 Z"/></svg> Like</span><span class="post-action"><svg viewBox="0 0 24 24"><path d="M4 4 H20 V16 H10 L6 20 V16 H4 Z"/></svg> Comment</span><span class="post-action"><svg viewBox="0 0 24 24"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg> Share</span></div></div>';
      f.appendChild(div);
    });
  });
}
var _auth=safeAuth();
if(_auth){ _auth.onAuthStateChanged(function(){ loadOtherAccounts(); loadFeed(); }); }
loadOtherAccounts(); loadFeed();
</script>
</body>
</html>
